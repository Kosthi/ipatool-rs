name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please check the [existing issues](https://github.com/Kosthi/ipatool-rs/issues) to avoid duplicates.

  - type: dropdown
    id: command
    attributes:
      label: Command
      description: Which subcommand or mode triggered the issue?
      options:
        - auth login
        - auth info / revoke
        - search
        - purchase
        - download
        - version list / meta
        - TUI (no subcommand)
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug. Include the exact command you ran if applicable.
      placeholder: |
        ipatool download -b com.example.app --purchase
        → Error: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: The IPA should download to the current directory.
    validations:
      required: true

  - type: textarea
    id: verbose_log
    attributes:
      label: Verbose log
      description: |
        Re-run your command with `--verbose` and paste the full output here.
        **Remove or redact your Apple ID email before posting.**
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ipatool-rs version
      description: Run `ipatool --version` and paste the result.
      placeholder: "0.1.5"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux x86_64
        - Linux ARM64
        - Windows x64
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might be relevant — country/storefront, app bundle ID, network setup, etc.
